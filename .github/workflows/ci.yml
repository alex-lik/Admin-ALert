name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: SemVer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate version file
        run: python tools/release.py validate

      - name: Show pending bump
        if: github.ref == 'refs/heads/main'
        run: |
          BASE=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$BASE" ]; then
            python tools/release.py next "$BASE..HEAD"
          else
            echo "no tags yet — first release will be tagged by hand"
          fi

  server:
    name: Server lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check app tests

      - name: Format check
        run: ruff format --check app tests

      - name: Type check
        run: mypy app

      - name: Test
        run: pytest -q --cov=app --cov-report=term-missing

      - name: Docker build
        run: docker build -t admin-alert-server:${{ github.sha }} .

  commitlint:
    name: Conventional commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate commit messages
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .commitlintrc.yml

  plan:
    name: Plan in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: docs/plan.md exists
        run: test -f docs/plan.md
